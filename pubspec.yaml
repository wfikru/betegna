name: betegna
description: TaskRabbit-like platform for Ethiopia - connect clients with local taskers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase (web-compatible versions)
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.6.5
  firebase_messaging: ^14.7.10

  # Auth - Google Sign-In
  google_sign_in: ^6.3.0

  # Maps & location
  geolocator: ^10.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Localization
  intl: ^0.20.2

  # UI & utilities
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  http: ^1.2.0
  uuid: ^4.2.2
  provider: ^6.1.1
  shared_preferences: ^2.2.2

  url_launcher: ^6.2.4
  # Optional: Chapa SDK placeholder (use http for simulation)
  # chapa_unofficial: ^0.0.1  # if available

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

dependency_overrides:
  # Fix JS interop issues for web
  web: ^0.5.1
  js: ^0.6.7

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
